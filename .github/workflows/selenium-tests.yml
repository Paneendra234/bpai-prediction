name: Selenium 300 E2E Web Test Suite

on:
  push:
    branches: [ main, master, workflow-pipeline ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "selenium-tests"
  cancel-in-progress: false

jobs:
  selenium-e2e-300:
    name: "🌐 Selenium — 300 Web E2E Test Cases & Excel Report"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python & Node Dependencies
        run: |
          python -m pip install --upgrade pip openpyxl django
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Node JS Selenium Test Runner
        run: |
          node selenium-tests/tests/login-tests.js

      - name: Run Python Selenium Web Tests & Generate Excel Report
        run: |
          python selenium-tests/selenium_test_runner.py
          python selenium-tests/generate_excel_report.py
          python tests/test_web.py

      - name: Upload Selenium Web JSON Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report-json
          path: reports_output/artifacts/selenium-web-report.json

      - name: Upload Selenium 300 Test Cases Excel Report Artifact (.xlsx)
        uses: actions/upload-artifact@v4
        with:
          name: selenium-300-test-cases-excel-report
          path: |
            selenium-tests/Selenium_Web_E2E_300_Test_Report.xlsx
            selenium-tests/Selenium_Web_E2E_300_Final_Report.xlsx

      - name: Upload Selenium 300 Test Cases CSV Report Artifact (.csv)
        uses: actions/upload-artifact@v4
        with:
          name: selenium-300-test-cases-csv-report
          path: |
            selenium-tests/Selenium_Web_E2E_300_Test_Report.csv
            selenium-tests/Selenium_Web_E2E_300_Test_Report_Output.csv
