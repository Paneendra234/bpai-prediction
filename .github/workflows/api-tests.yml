name: Backend API 300 Test Suite

on:
  push:
    branches: [ main, master, workflow-pipeline ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "api-tests"
  cancel-in-progress: false

jobs:
  backend-api-300:
    name: "🧪 Backend API — 300 Test Cases & Excel Report"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip openpyxl django
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Backend API 300 Test Runner
        run: |
          python api-tests/api_test_runner.py

      - name: Generate Backend API 300 Test Cases Excel & CSV Reports
        run: |
          python api-tests/generate_api_excel_report.py

      - name: Upload Backend API JSON Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-api-report-json
          path: reports_output/artifacts/backend-api-report.json

      - name: Upload Backend API 300 Test Cases Excel Report Artifact (.xlsx)
        uses: actions/upload-artifact@v4
        with:
          name: backend-api-300-excel-report
          path: |
            api-tests/Backend_API_300_Final_Report.xlsx
            api-tests/Backend_API_300_Test_Report.xlsx

      - name: Upload Backend API 300 Test Cases CSV Report Artifact (.csv)
        uses: actions/upload-artifact@v4
        with:
          name: backend-api-300-csv-report
          path: |
            api-tests/Backend_API_300_Test_Report.csv
            api-tests/Backend_API_300_Test_Report_Output.csv
