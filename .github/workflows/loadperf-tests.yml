name: Load & Performance 300 Test Suite

on:
  push:
    branches: [ main, master, workflow-pipeline ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "loadperf-tests"
  cancel-in-progress: false

jobs:
  loadperf-300:
    name: "⚡ Load & Performance — 300 Test Cases & Excel Report"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip openpyxl django
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Load & Performance 300 Test Runner
        run: |
          python loadperf-tests/loadperf_test_runner.py

      - name: Generate Load & Performance 300 Test Cases Excel & CSV Reports
        run: |
          python loadperf-tests/generate_loadperf_excel_report.py

      - name: Upload Load & Performance JSON Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: loadperf-report-json
          path: reports_output/artifacts/loadperf-report.json

      - name: Upload Load & Performance 300 Test Cases Excel Report Artifact (.xlsx)
        uses: actions/upload-artifact@v4
        with:
          name: loadperf-300-excel-report
          path: |
            loadperf-tests/Load_Performance_300_Final_Report.xlsx
            loadperf-tests/Load_Performance_300_Test_Report.xlsx

      - name: Upload Load & Performance 300 Test Cases CSV Report Artifact (.csv)
        uses: actions/upload-artifact@v4
        with:
          name: loadperf-300-csv-report
          path: |
            loadperf-tests/Load_Performance_300_Test_Report.csv
            loadperf-tests/Load_Performance_300_Test_Report_Output.csv
